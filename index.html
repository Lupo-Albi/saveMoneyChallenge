<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>saveMoneyChallenge</title>
  </head>
  <body>
    <header>
        <h1>Desafio de Economia de Dinheiro</h1>
    </header>
    <main>
      <form action="/index.html" method="post">
        <input type="date" name="startDate" id="startDate" />
        <input type="date" name="endDate" id="endDate" />
        <input type="number" name="initialInvestment" id="initialInvestment" placeholder="Investimento Inicial" />
        <input type="number" name="investmentInterval" id="investmentInterval" placeholder="Intervalo de cada investimento" />
        <input type="number" name="increment" id="increment" placeholder="Incremento no valor de cada investimento">
        <button type="submit">Calcular</button>
      </form>
    </main>
    <footer>
        <p>Lupo Albi. 2026</p>
    </footer>
  </body>
</html>
